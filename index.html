<link rel="stylesheet" href="colors_and_type.css?v=103919551ae8" />
<style>
  html, body { margin: 0; padding: 0; background: #0B0B14; height: 100%; }
  *, *::before, *::after { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  body.locked deck-stage { display: none; }
  #auth-gate {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0B0B14;
    z-index: 9999;
    font-family: "Poppins", system-ui, -apple-system, sans-serif;
  }
  #auth-gate[hidden] { display: none; }
  .auth-card {
    width: min(92vw, 440px);
    padding: 28px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.04);
    color: #fff;
  }
  .auth-card h1 { margin: 0 0 10px; font-size: 28px; }
  .auth-card p { margin: 0 0 16px; color: rgba(255,255,255,0.72); font-size: 18px; line-height: 1.45; }
  .auth-card input {
    width: 100%; height: 44px; padding: 0 12px;
    border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.24);
    background: rgba(0, 0, 0, 0.25); color: #fff;
    font-size: 18px;
    outline: none;
  }
  .auth-card button {
    margin-top: 12px; width: 100%; height: 44px;
    border: 0; border-radius: 10px;
    background: #6C69FF; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer;
  }
  #auth-error { margin-top: 10px; min-height: 22px; color: #FF9A9A; font-size: 18px; }

  @keyframes deck-slide-enter {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  deck-stage [data-deck-active] > * {
    animation: deck-slide-enter 0.52s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  deck-stage [data-deck-active] > [data-deck-no-enter] {
    animation: none !important;
  }
  @media (prefers-reduced-motion: reduce) {
    deck-stage [data-deck-active] > * { animation: none !important; }
  }
  @media print {
    deck-stage [data-deck-active] > * { animation: none !important; }
  }

  body.locked .deck-doc-nav { display: none; }
  .deck-doc-nav {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 2147483100;
    display: flex;
    align-items: center;
    gap: 6px 14px;
    padding: 10px 18px;
    background: rgba(11, 11, 20, 0.88);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    font-family: "Poppins", system-ui, -apple-system, sans-serif;
    font-size: 18px;
    line-height: 1.2;
  }
  .deck-doc-nav a {
    color: rgba(255, 255, 255, 0.92);
    font-weight: 600;
    text-decoration: none;
  }
  .deck-doc-nav a:hover {
    color: #fff;
    text-decoration: underline;
  }
  .deck-doc-nav .deck-doc-sep {
    color: rgba(255, 255, 255, 0.35);
    user-select: none;
  }
</style>

<script>
  // Change this value to rotate the deck password.
  const DECK_PASSWORD = "worldcup2026";
  const AUTH_KEY = "sym_wc_deck_auth";

  function unlockDeck() {
    document.body.classList.remove("locked");
    document.getElementById("auth-gate").hidden = true;
    sessionStorage.setItem(AUTH_KEY, "ok");
  }

  if (sessionStorage.getItem(AUTH_KEY) === "ok") {
    unlockDeck();
  } else {
    const form = document.getElementById("auth-form");
    const input = document.getElementById("auth-password");
    const error = document.getElementById("auth-error");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (input.value === DECK_PASSWORD) {
        unlockDeck();
      } else {
        error.textContent = "Incorrect password. Please try again.";
        input.value = "";
        input.focus();
      }
    });
    setTimeout(() => input.focus(), 0);
  }
</script>
